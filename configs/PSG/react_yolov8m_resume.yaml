# _BASE_: "react_yolov8m.yaml"
INPUT:
  MIN_SIZE_TRAIN: 640
  MAX_SIZE_TRAIN: 640
  MIN_SIZE_TEST: 640
  MAX_SIZE_TEST: 640
  PADDING: True
MODEL:
  TEXT_EMBEDDING: glove.6B
  META_ARCHITECTURE: "GeneralizedYOLO"
  BOX_HEAD: False
  WEIGHT: ""
  PRETRAINED_DETECTOR_CKPT: "./checkpoints/PSG/yolov8m/weights/best.pt"
  BACKBONE:
    TYPE: "yolo"
    NMS_THRESH: 0.001
    FREEZE: True
  YOLO:
    SIZE: "yolov8m"
    OUT_CHANNELS: [192,384,576] # [192,384,576] for yolov8m, [256,512,768] for yolov8l, [256,512,512] for yolo11m, [256,512,512] for yolov12m etc...
  RELATION_ON: True
  ATTRIBUTE_ON: False
  FLIP_AUG: False            # if there is any left-right relation, FLIP AUG should be false
  ROI_HEADS:
    POSITIVE_FRACTION: 0.5
    FG_IOU_THRESHOLD: 0.3
    BG_IOU_THRESHOLD: 0.1
    BATCH_SIZE_PER_IMAGE: 256
    DETECTIONS_PER_IMG: 100
    NMS_FILTER_DUPLICATES: True
    NMS: 0.2
  ROI_BOX_HEAD:
    POOLER_RESOLUTION: 7
    POOLER_SAMPLING_RATIO: 2
    FEATURE_EXTRACTOR: "YOLOV8FeatureExtractor"
    NUM_CLASSES: 134              # 151 for VG, 1201 for GQA
    MLP_HEAD_DIM: 512
    POOLER_SCALES: (0.125, 0.0625, 0.03125)
  ROI_RELATION_HEAD:
    EMBED_DIM: 200
    USE_GT_BOX: False
    USE_GT_OBJECT_LABEL: False
    MLP_HEAD_DIM: 512
    TEXTUAL_FEATURES_ONLY: False
    USE_SPATIAL_FEATURES: True
    USE_UNION_FEATURES: False
    REQUIRE_BOX_OVERLAP: False              # for sgdet, during training, only train pairs with overlap
    ADD_GTBOX_TO_PROPOSAL_IN_TRAIN: True    # for sgdet only, in case some gt boxes are missing
    NUM_CLASSES: 57                 # 51 for VG, 201 for GQA (not contain "to the left of" & "to the right of")
    BATCH_SIZE_PER_IMAGE: 256      # sample as much as possible
    POSITIVE_FRACTION: 0.25
    CONTEXT_POOLING_DIM: 2048
    CONTEXT_HIDDEN_DIM: 512         #1024 for VCTree
    POOLING_ALL_LEVELS: True
    LABEL_SMOOTHING_LOSS: False
    FEATURE_EXTRACTOR: "RelationFeatureExtractor"
    #################### Select Relationship Model ####################
    #PREDICTOR: "MotifPredictor"
    #PREDICTOR: "VCTreePredictor"
    #PREDICTOR: "TransformerPredictor"
    PREDICTOR: "REACTPredictor"
    ################# Parameters for Motif Predictor ##################
    CONTEXT_OBJ_LAYER: 1
    CONTEXT_REL_LAYER: 1
    ############# Parameters for Causal Unbias Predictor ##############
    ### Implementation for paper "Unbiased Scene Graph Generation from Biased Training"
    CAUSAL:
      EFFECT_TYPE: 'TDE'             # candicates: 'TDE', 'NIE', 'TE', 'none'
      FUSION_TYPE: 'gate'              # candicates: 'sum', 'gate'         
      SEPARATE_SPATIAL: False         # separate spatial in union feature
      CONTEXT_LAYER: "vctree"         # candicates: motifs, vctree, vtranse
      EFFECT_ANALYSIS: True
    ############### Parameters for Transformer Predictor ##############
    TRANSFORMER:
      DROPOUT_RATE: 0.1
      OBJ_LAYER: 4
      REL_LAYER: 2
      NUM_HEAD: 8
      KEY_DIM: 64
      VAL_DIM: 64
      INNER_DIM: 2048 
DATASETS:
  TRAIN: ("PSG_train",)
  VAL: ("PSG_val",)
  TEST: ("PSG_test",)
DATALOADER:
  SIZE_DIVISIBILITY: 32

# Resume training from checkpoint: checkpoints/react_PSG/best_model_epoch_11.pth
# Instructions:
#   1. Copy checkpoint: cp checkpoints/react_PSG/best_model_epoch_11.pth output/react_PSG_resume/model_final.pth
#   2. Run: CUDA_VISIBLE_DEVICES=0 python tools/relation_train_net.py --config-file configs/PSG/react_yolov8m_resume.yaml

SOLVER:
  MAX_EPOCH: 30                      # Train from epoch 11 → 30 (19 more epochs)
  BASE_LR: 0.001                     # Reduced LR for fine-tuning (original: 0.01)
  WARMUP_FACTOR: 1.0                 # No warmup needed when resuming
  WEIGHT_DECAY: 0.0001
  MOMENTUM: 0.9
  GRAD_NORM_CLIP: 5.0
  
  # Learning rate schedule
  STEPS: (5000, 10000)               # Adjust based on remaining training
  MAX_ITER: 50000                    # Total iterations
  VAL_PERIOD: 1000                   # Validate every 1000 iterations
  CHECKPOINT_PERIOD: 1000            # Save checkpoint every 1000 iterations
  PRINT_GRAD_FREQ: 2000
  
  SCHEDULE:
    TYPE: "WarmupReduceLROnPlateau"
    PATIENCE: 2
    THRESHOLD: 0.001
    COOLDOWN: 0
    FACTOR: 0.1
    MAX_DECAY_STEP: 3
  
  UPDATE_SCHEDULE_DURING_LOAD: True  # Important! Update scheduler state from checkpoint

OUTPUT_DIR: './output/react_PSG_resume'

# Optional: Track metrics you want to optimize
METRIC_TO_TRACK: "mR"  # Options: mR, R, zR, ng-zR, ng-R, ng-mR, topA

# Model config remains the same (inherited from base config)
# Backbone is frozen by default (FREEZE: True)
